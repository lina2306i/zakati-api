name: JSON Validator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "schema/**"
      - ".github/workflows/json-validator.yml"

jobs:
  validate-json:
    name: Validate country datasets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax + DX schema rules
        run: python scripts/validate_data.py
