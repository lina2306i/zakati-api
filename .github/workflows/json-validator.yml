name: JSON Validator

on:
  pull_request:
    branches:
      - main
    paths:
      - "data/**/*.json"

jobs:
  validate-json:
    name: Validate country JSON files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate all JSON files under data/
        run: |
          set -euo pipefail
          echo "Scanning data/**/*.json for syntax errors..."
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            python -m json.tool "$file" > /dev/null
            count=$((count + 1))
          done < <(find data -type f -name '*.json' -print0 | sort -z)

          if [ "$count" -eq 0 ]; then
            echo "No JSON files found under data/"
            exit 1
          fi

          echo "Success: validated $count JSON file(s)."
